[package]
name = "breaker-panel"
version = "0.1.2"
edition = "2024"
# En una librería la MSRV es una promesa a quien la consume. Va por debajo del pin de
# `rust-toolchain.toml` porque nada en el crate exige uno más nuevo, y por eso la verifica el
# job `msrv` del CI. 1.85 es el suelo: lo exigen la edición 2024, `toml` y `notify`. Ver `.claude/rules/00-rust-toolchain.md`.
rust-version = "1.85"
description = "Embedded hierarchical kill switches: a local TOML file, hot reload and cascading by key prefix, no external service."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexxcelerateDev/breaker-panel"
keywords = ["kill-switch", "feature-flags", "toggles", "hot-reload", "toml"]
categories = ["config"]
# Solo lo que necesita quien lo consume (o lo prueba): las notas internas (`CLAUDE.md`,
# `.claude/`, `docs/`) y la config del repo no viajan en el paquete.
include = ["src/", "examples/", "tests/", "README.md", "LICENSE-*"]

[features]
default = ["watch", "registry"]
# Recarga en caliente. `notify` llega reexportado por el debouncer: una dependencia menos que
# mantener alineada.
watch = ["dep:notify-debouncer-full"]
# `flag_key!`: keys declaradas en código y validadas en cada carga.
registry = ["dep:linkme"]

[dependencies]
arc-swap = "1.9.2"
linkme = { version = "0.3.37", optional = true }
notify-debouncer-full = { version = "0.7.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
# Solo leer: sin `display` (serializar) ni el resto de defaults.
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
# Sin `attributes`: no se usa `#[instrument]` y ahorra un proc-macro al consumidor.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
# En una librería la documentación es parte de la API: con el gate a `deny`, un `pub` sin `///`
# rompe el CI.
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Todo `pub fn` que devuelve `Result` dice en `# Errors` cuándo falla. De `pedantic` entran este
# y `too_many_lines` (en `src/lib.rs`, solo fuera de los tests): lint por lint, nunca el grupo.
missing_errors_doc = "warn"
dbg_macro = "warn"
todo = "warn"
# Exenciones con `#[expect(..., reason = "...")]`, nunca `#[allow]`: ver
# `.claude/rules/00-rust-toolchain.md`. Los dos son de `restriction`, uno por uno.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dev-dependencies]
# Solo para `examples/axum.rs`: no llegan al consumidor.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

# Usa `watch_file` y `flag_key!`: con `--no-default-features` no compilaría, así que cargo lo
# salta en vez de romper el paso del CI que prueba sin features.
[[example]]
name = "axum"
required-features = ["watch", "registry"]
