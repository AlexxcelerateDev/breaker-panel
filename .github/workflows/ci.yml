name: CI

on:
  push:
    # Tiene que coincidir con la rama por defecto del repo: si no, los merges a la default no
    # disparan nada y el hueco no avisa de su existencia.
    branches: [main]
  pull_request:
  schedule:
    # Los advisories nuevos aparecen sin que cambie el código: revisión semanal.
    - cron: "0 6 * * 1"

# Mínimo privilegio: el job solo lee el repo. Un step que necesite escribir lo pide explícitamente.
permissions:
  contents: read

# Un push nuevo a la misma PR cancela el run anterior; en main se dejan terminar todos para no
# perder la señal de un commit ya integrado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token quedaría en .git/config al alcance de cualquier step posterior, incluido el
          # build de una dependencia. Este workflow no hace push.
          persist-credentials: false

      # Respeta rust-toolchain.toml (pin + rustfmt + clippy) y trae cache integrado.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Por defecto exporta `CARGO_BUILD_WARNINGS=deny` a todos los steps, también a
          # `cargo test` y a la MSRV, donde el gate local no lo lleva. Vacío = no exportarlo:
          # se deniega step a step, como en el gate de `CLAUDE.md`.
          build-warnings: ""

      # Binarios precompilados: instalarlos desde fuente costaría más que todo el resto del job.
      - name: Instalar cargo-hack, cargo-semver-checks y cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-hack,cargo-semver-checks,cargo-deny

      - name: Formato
        run: cargo fmt --all --check

      # `watch` y `registry` son opcionales: un `use` o un `cfg` que solo cuadra con alguna
      # encendida rompe al consumidor que la apaga. `--feature-powerset` pasa por cada
      # combinación: ninguna, cada una sola y todas. Sin `default`, que son las dos y repetiría
      # una.
      - name: Lint estricto, por combinación de features
        run: cargo hack clippy --feature-powerset --exclude-features default --all-targets --locked
        env:
          CARGO_BUILD_WARNINGS: deny

      # Sin `--lib` a propósito: en una librería los doctests son los ejemplos de la API, y
      # `cargo test` a secas corre unitarios, `tests/` y doctests en un solo paso. Por
      # combinación porque los doctests solo se compilan aquí: clippy no los ve.
      - name: Tests, por combinación de features
        run: cargo hack test --feature-powerset --exclude-features default --locked

      # La documentación es parte de la API: un enlace [`X`] roto o un `pub` sin documentar
      # rompe aquí. `build.warnings` también cubre a rustdoc (verificado), así que no hace
      # falta `RUSTDOCFLAGS`. Por combinación, como el lint: un enlace a algo que traen `watch`
      # o `registry` se rompe con ellas apagadas.
      - name: Documentación, por combinación de features
        run: cargo hack doc --feature-powerset --exclude-features default --no-deps --locked
        env:
          CARGO_BUILD_WARNINGS: deny

      # La API pública es el contrato (`.claude/rules/01-library.md`): compara con la última
      # versión de crates.io, y un cambio incompatible falla hasta que el PR sube la versión.
      - name: Compatibilidad semver
        run: cargo semver-checks

      # Como el lint sin features: llevar un item a detrás de `watch` o `registry` rompe al
      # consumidor que las apaga, y el paso anterior, con todas encendidas, no lo ve (probado).
      - name: Compatibilidad semver sin features por defecto
        run: cargo semver-checks --only-explicit-features

      - name: Auditoría de dependencias
        run: cargo deny check

  # La MSRV (`rust-version`) va por debajo del pin de `rust-toolchain.toml`: compilar con esa
  # versión exacta es lo que impide que sea una promesa sin probar. Basta con compilar lib, tests
  # y ejemplos; clippy y los tests ya corren con el pin en el job `ci`.
  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # Tiene que coincidir con `rust-version` de `Cargo.toml`.
          toolchain: "1.85.0"
          build-warnings: ""

      - name: Compilar con la MSRV
        run: cargo +1.85.0 check --all-targets --locked

  # FSEvents vigila por ruta y no por inodo como inotify: recrear el directorio no corta la
  # recarga. Los tests de eso son `cfg(target_os = "macos")` y en Linux ni compilan, así que
  # clippy también los lintea solo aquí. Nada más: en un repo privado, un minuto de macOS cuenta
  # por diez.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          build-warnings: ""

      - name: Lint estricto
        run: cargo clippy --all-targets --locked
        env:
          CARGO_BUILD_WARNINGS: deny

      - name: Tests
        run: cargo test --locked
